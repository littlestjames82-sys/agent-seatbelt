[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghost-seatbelt"
version = "0.3.0"
description = "Deterministic guardrails for AI coding agents — Seatbelt gates what your agent does before it does it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ghost Developer Studio" },
]
keywords = ["ai-agents", "browser-automation", "guardrails", "policy", "approval", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/littlestjames82-sys/agent-seatbelt"
Repository = "https://github.com/littlestjames82-sys/agent-seatbelt"
Issues = "https://github.com/littlestjames82-sys/agent-seatbelt/issues"
Changelog = "https://github.com/littlestjames82-sys/agent-seatbelt/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_seatbelt"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
