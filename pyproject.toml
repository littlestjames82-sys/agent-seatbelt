[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-seatbelt"
version = "0.2.0"
description = "A seatbelt for browser agents: record-first, fail-closed policy gating for agent actions — before they happen."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ghost Developer Studio" },
]
keywords = ["ai-agents", "browser-automation", "guardrails", "policy", "approval", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/littlestjames82-sys/agent-seatbelt"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_seatbelt"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
