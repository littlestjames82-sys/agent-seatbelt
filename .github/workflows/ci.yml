name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest build
      - name: Test suite
        run: python -m pytest tests/ -q
      - name: Bench
        run: python bench/run_bench.py
      - name: Injection bench
        run: python bench/run_injection.py
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: JS policy tests
        run: |
          node --test experimental/mods/policy.test.mjs
          node --test experimental/opencode/seatbelt-opencode.test.mjs
      - name: Validate plugin manifests
        continue-on-error: true
        run: |
          pip install claude-code || true
          claude plugin validate . || true
